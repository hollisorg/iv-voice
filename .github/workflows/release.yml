# Builds, signs and uploads the Windows installer when a version tag is pushed (e.g. v0.2.0).
# The result is a DRAFT GitHub release: review it, then click Publish. Installed apps only see
# published releases, so nothing reaches users until then.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    environment: windows-signing
    permissions:
      contents: write
      id-token: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tag matches package.json version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $expected"
            exit 1
          fi

      # Create the one draft up front. electron-builder only builds; the files are uploaded to this
      # draft after the signature check (its own publishing could open a second draft).
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" -q ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")
          if [ -z "$existing" ]; then
            gh release create "$GITHUB_REF_NAME" --draft --title "${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md for what changed."
          else
            echo "Release for $GITHUB_REF_NAME already exists ($existing)"
          fi

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Sign in to Azure using GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        env:
          AZURE_CORE_OUTPUT: none
        with:
          client-id: ${{ vars.IV_SIGNING_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.IV_SIGNING_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Build and verify signed Windows release
        run: npm run dist:win-release

      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/IV-Voice-Setup.exe dist/IV-Voice-Setup.exe.blockmap dist/latest.yml --clobber
